# fleet.yaml
defaultNamespace: grafana-postgres

namespaceLabels:
  okbtsp.corp/department: OIT
  okbtsp.corp/owner: baranav
  okbtsp.corp/project: grafana-postgres

name: grafana-postgres

# Кастомизация под кластеры
targetCustomizations:
  # === AGGREGATOR ===
  - name: aggregator
    clusterSelector:
      matchLabels:
        okbtsp.corp/monitoring-aggregator: "true"
    helm:
      takeOwnership: true
      chart: postgresql
      repo: https://charts.bitnami.com/bitnami
      version: 18.1.8
      valuesFiles:
        - postgres-values.yaml

  - name: namespace-only-placeholder
    clusterSelector:
      matchLabels:
        okbtsp.corp/department: OIT
    kustomize:
      dir: "base"

dependsOn:
  - selector:
      matchLabels:
        okbtsp.corp/project: external-secrets
  - name: prom-operator
